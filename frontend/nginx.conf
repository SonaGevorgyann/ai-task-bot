server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bot creates boards and tasks on the internal API. The public site only reads and updates an existing board.
    location /api/boards {
        return 404;
    }

    location /api/ {
        limit_except GET PATCH DELETE {
            deny all;
        }
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
